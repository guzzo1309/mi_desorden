name: "🐛 Bug"
description: "Algo no funciona"
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Área
      options:
        - API
        - Cliente
        - Core
    validations:
      required: true

  - type: textarea
    id: que_pasa
    attributes:
      label: Qué pasa
    validations:
      required: true

  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true

  - type: textarea
    id: esperado
    attributes:
      label: Qué debería pasar
    validations:
      required: true

  - type: textarea
    id: entorno
    attributes:
      label: Entorno
      placeholder: "Teléfono, versión de iOS/Android, rama"
    validations:
      required: false
